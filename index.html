<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #050510; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .muter {
    animation: putar 8s linear infinite;
    transform-origin: 200px 200px;
  }
  @keyframes putar {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .tulang { stroke: #e8e8e8; stroke-width: 3; fill: none; stroke-linecap: round; }
  .tulang-biru { stroke: #4de3ff; stroke-width: 2; fill: none; opacity: 0.8; }
  .tengkorak { fill: #f2f2f2; stroke: #fff; stroke-width: 2; }
</style>
</head>
<body>
<svg width="380" height="380" viewBox="0 0 400 400">
  <g class="muter">
    <path class="tulang" d="M200 200 C 280 200, 320 150, 300 90 C 280 40, 200 40, 170 90 C 150 130, 200 160, 250 130" />
    <path class="tulang-biru" d="M200 200 C 260 200, 300 160, 285 110 C 270 70, 210 60, 185 95" />
    <path class="tulang" d="M200 200 L 200 90 L 180 70 L 160 60" />
    <path class="tulang" d="M200 200 L 210 110 L 230 80" />
    <path class="tulang" d="M195 130 Q 150 130 145 160" />
    <path class="tulang" d="M205 130 Q 250 130 255 160" />
    <path class="tulang" d="M195 155 Q 145 155 140 185" />
    <path class="tulang" d="M205 155 Q 255 155 260 185" />
    <path class="tulang" d="M195 180 Q 155 180 150 210" />
    <path class="tulang" d="M205 180 Q 245 180 250 210" />
    <path class="tulang" d="M190 120 L 80 60 L 120 130 L 70 150" />
    <path class="tulang" d="M210 120 L 320 60 L 280 130 L 330 150" />
    <path class="tulang" d="M160 60 L 110 40" />
    <g transform="translate(90,25) rotate(-30)">
      <path class="tengkorak" d="M0 0 L 35 5 L 50 20 L 45 35 L 20 38 L 0 25 Z" />
      <circle cx="15" cy="18" r="5" fill="black" />
      <path class="tulang" d="M5 0 L 0 -15 M15 2 L 12 -18 M28 5 L 30 -12" />
      <path class="tulang" d="M45 30 L 60 38 M45 35 L 58 45" />
    </g>
    <path class="tulang" d="M190 190 L 150 250 L 130 260" />
    <path class="tulang" d="M210 190 L 250 250 L 270 260" />
    <path class="tulang" d="M200 100 L 200 80 M200 130 L 200 110 M200 160 L 200 140" />
  </g>
  <circle cx="200" cy="200" r="10" fill="#4de3ff" opacity="0.9">
    <animate attributeName="r" values="8;14;8" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
</body>
</html>
